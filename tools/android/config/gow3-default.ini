# Experimental AYN Thor boot profile; independent of the desktop installation.
# SM8475 / Snapdragon 8+ Gen 1 performance baseline:
# 480p game target + FSR 3.1 Performance (2x) -> ~427x240 internal render, then 720p output.
# Start at 30 FPS so first device validation prioritizes stable gameplay and thermal headroom.
upscaler=fsr3
preset=3
output_res=1280x720
render_resolution=480p
fps_limit=30
engine_fps=60
display_mode=fullscreen
vsync=0
frames_queued=1
async_shaders=1
deferred_readback=1
stale_readback=1
live_resolution=0
sharpen=0
sharpness=0.50
object_motion=0
show_fps=1
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=0
effect_dynamic_shadows=0
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0
# 0=手柄浮层空白触摸不移动鼠标(默认), 1=空白触摸映射为鼠标移动+左键
overlay_mouse=0

# SDL names describe positions; the Thor's printed labels are Nintendo style.
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
